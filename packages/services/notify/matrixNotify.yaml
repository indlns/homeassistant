matrixnotify:
  matrix:
    homeserver: !secret matrix_homeserver
    username: !secret matrix_username
    password: !secret matrix_password
    rooms:
      - !secret matrix_room
    commands:
      - word: hello
        name: hello
        rooms:
          - !secret matrix_room
      - expression: "My name is (?P<name>.*)"
        name: introduction
      - reaction: 👍
        name: thumbsup